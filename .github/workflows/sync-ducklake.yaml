name: Sync ducklake subtree

on:
  push:
    branches: [main]
    paths: [third_party/ducklake/**]

jobs:
  sync:
    name: Push subtree to relytcloud/ducklake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for subtree split

      - name: Split and push subtree
        env:
          DUCKLAKE_TOKEN: ${{ secrets.DUCKLAKE_PUSH_TOKEN }}
        run: |
          git subtree split --prefix=third_party/ducklake -b ducklake-split
          git remote add ducklake \
            "https://x-access-token:${DUCKLAKE_TOKEN}@github.com/relytcloud/ducklake.git"
          git push ducklake ducklake-split:pg_ducklake --force
