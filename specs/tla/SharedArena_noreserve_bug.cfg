\* Bug mode: the whole arena is one pool.  s1's stalled backend keeps every
\* page s1 wrote and s2 never gets one.  Expected: FairSessionsComplete violated.
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1, s2}
  ReservedPages = 1
  SharedPages = 1
  Chunks = 3
  FairBackends = {s2}
  ReservePerSession = FALSE
  FreeBeforeWait = TRUE
INVARIANTS TypeOK PageConservation
PROPERTY FairSessionsComplete
