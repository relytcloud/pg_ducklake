\* Bug mode: a detach does not fail the RPC in flight.  A session whose
\* backend aborted mid-RPC waits for a reply forever and is never reaped.
\* Expected: FairSessionsExit violated (or deadlock).
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1}
  Chunks = 2
  MaxRpcs = 1
  OutboxCap = 1
  RespCap = 1
  ReqCap = 1
  FairBackends = {s1}
  ResetLatchFirst = TRUE
  NonBlockingSend = TRUE
  FailMetaOnDetach = FALSE
INVARIANTS TypeOK Bounded OneMetaInFlight ReplyMatchesRequest TerminalIsLast MainNeverBlocked NoLostWakeup
PROPERTY FairSessionsExit
