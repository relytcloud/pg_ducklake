\* Bug mode: the main thread does not fail a pending RPC when the backend
\* detaches.  A session whose backend aborted mid-RPC blocks forever, pins a
\* capacity slot, and later backends wait forever.  Expected: Settles violated.
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2}
  MaxSessions = 1
  MailboxCap = 2
  QueriesPerBackend = 1
  MaxRpcs = 1
  MaxWorkerExits = 0
  WorkerExitAllowed = FALSE
  WorkerCrashAllowed = FALSE
  HandleReuse = TRUE
  ValidateNonce = TRUE
  AbortDetaches = TRUE
  ExitDrains = TRUE
  DetachWakesSession = FALSE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
PROPERTY Settles
