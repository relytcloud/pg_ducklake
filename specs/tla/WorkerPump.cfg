\* Implemented pump: two sessions, both backends keep pulling, aborts allowed
\* at any point.  Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1, s2}
  Chunks = 2
  MaxRpcs = 1
  OutboxCap = 1
  RespCap = 1
  ReqCap = 1
  FairBackends = {s1, s2}
  ResetLatchFirst = TRUE
  NonBlockingSend = TRUE
  FailMetaOnDetach = TRUE
INVARIANTS TypeOK Bounded OneMetaInFlight ReplyMatchesRequest TerminalIsLast MainNeverBlocked NoLostWakeup
PROPERTY FairSessionsExit
PROPERTY FairBackendsSettle
