\* Implemented protocol: 3 backends, worker capacity 2, mailbox of 2, handle
\* reuse on, worker may exit cleanly once.  Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2, b3}
  MaxSessions = 2
  MailboxCap = 2
  QueriesPerBackend = 1
  MaxRpcs = 1
  MaxWorkerExits = 1
  WorkerExitAllowed = TRUE
  WorkerCrashAllowed = FALSE
  HandleReuse = TRUE
  ValidateNonce = TRUE
  AbortDetaches = TRUE
  ExitDrains = TRUE
  DetachWakesSession = TRUE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
PROPERTY Settles
PROPERTY Quiescent
