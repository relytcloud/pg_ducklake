\* Bug mode: the backend returns a consumed page only when the next chunk
\* arrives.  With its single reserved page the session cannot write that
\* chunk, so producer and consumer wait for each other.  Expected:
\* FairSessionsComplete violated (deadlock).
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1}
  ReservedPages = 1
  SharedPages = 0
  Chunks = 2
  FairBackends = {s1}
  ReservePerSession = TRUE
  FreeBeforeWait = FALSE
INVARIANTS TypeOK PageConservation
PROPERTY FairSessionsComplete
