\* Bug mode: a backend abort leaves its segment attached.  Expected:
\* Quiescent violated (the segment is never destroyed).
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2}
  MaxSessions = 2
  MailboxCap = 2
  QueriesPerBackend = 1
  MaxRpcs = 1
  MaxWorkerExits = 0
  WorkerExitAllowed = FALSE
  WorkerCrashAllowed = FALSE
  HandleReuse = TRUE
  ValidateNonce = TRUE
  AbortDetaches = FALSE
  ExitDrains = TRUE
  DetachWakesSession = TRUE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
PROPERTY Quiescent
