\* Bug mode: the main loop resets its latch after the scan instead of before
\* it.  A wakeup that lands between the scan and the reset is lost and the
\* loop sleeps with work pending.  Expected: deadlock.
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1}
  Chunks = 2
  MaxRpcs = 1
  OutboxCap = 1
  RespCap = 1
  ReqCap = 1
  FairBackends = {s1}
  ResetLatchFirst = FALSE
  NonBlockingSend = TRUE
  FailMetaOnDetach = TRUE
INVARIANTS TypeOK Bounded OneMetaInFlight ReplyMatchesRequest TerminalIsLast MainNeverBlocked NoLostWakeup
PROPERTY FairSessionsExit
