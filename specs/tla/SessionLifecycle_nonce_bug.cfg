\* Bug mode: the worker trusts the mailbox entry and attaches without
\* comparing the nonce in the segment header.  A backend posts, aborts, and
\* its handle is reused by another backend's segment, which then gets served
\* twice.  Expected: NoDoubleServe violated.
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2, b3}
  MaxSessions = 2
  MailboxCap = 2
  QueriesPerBackend = 1
  MaxRpcs = 1
  MaxWorkerExits = 0
  WorkerExitAllowed = FALSE
  WorkerCrashAllowed = FALSE
  HandleReuse = TRUE
  ValidateNonce = FALSE
  AbortDetaches = TRUE
  ExitDrains = TRUE
  DetachWakesSession = TRUE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
