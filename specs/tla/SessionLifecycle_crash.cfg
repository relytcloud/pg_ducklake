\* Hard worker death (postmaster shared-memory reset) with two dispatches per
\* backend; clean exits are covered by SessionLifecycle.cfg.  Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2}
  MaxSessions = 1
  MailboxCap = 1
  QueriesPerBackend = 2
  MaxRpcs = 1
  MaxWorkerExits = 1
  WorkerExitAllowed = FALSE
  WorkerCrashAllowed = TRUE
  HandleReuse = TRUE
  ValidateNonce = TRUE
  AbortDetaches = TRUE
  ExitDrains = TRUE
  DetachWakesSession = TRUE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
PROPERTY Settles
PROPERTY Quiescent
