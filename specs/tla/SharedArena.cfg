\* Proposed arena: two reserved pages per session, one shared overflow page,
\* s1's backend may stall forever holding its pages.  Expected: no error (s2 still completes).
SPECIFICATION Spec
CONSTANTS
  Sessions = {s1, s2}
  ReservedPages = 2
  SharedPages = 1
  Chunks = 3
  FairBackends = {s2}
  ReservePerSession = TRUE
  FreeBeforeWait = TRUE
INVARIANTS TypeOK PageConservation
PROPERTY FairSessionsComplete
