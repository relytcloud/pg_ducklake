\* Bug mode: the worker exits without interrupting and joining its session
\* threads.  Expected: NoSessionWithoutWorker violated (threads outlive the
\* process that owns the engine and the segments).
SPECIFICATION Spec
CONSTANTS
  Backends = {b1, b2}
  MaxSessions = 2
  MailboxCap = 2
  QueriesPerBackend = 1
  MaxRpcs = 1
  MaxWorkerExits = 1
  WorkerExitAllowed = TRUE
  WorkerCrashAllowed = FALSE
  HandleReuse = TRUE
  ValidateNonce = TRUE
  AbortDetaches = TRUE
  ExitDrains = FALSE
  DetachWakesSession = TRUE
INVARIANTS TypeOK WorkerTouchesOnlyAttached CapacityOK NoDoubleServe SingleOwner NoSessionWithoutWorker MailboxBounded
